name: Custom Build Wrapper
on:
  workflow_dispatch:
  schedule:
    - cron: "0 16 * * *"

concurrency:
  group: custom-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    permissions: write-all
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v5
        with:
          distribution: "zulu"
          java-version: "21"

      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Should build?
        id: should_build
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! git fetch --no-tags origin custom-update; then
            echo "no custom build state yet; building!"
            echo "SHOULD_BUILD=1" >> $GITHUB_OUTPUT
          elif ! git show origin/custom-update:build.md > build.md; then
            echo "custom build state is missing build.md; building!"
            echo "SHOULD_BUILD=1" >> $GITHUB_OUTPUT
          else
            UPDATE_CFG=$(./build.sh custom_config.toml --config-update)
            if [ "$UPDATE_CFG" ]; then
              echo "'$UPDATE_CFG'"
              echo "SHOULD_BUILD=1" >> $GITHUB_OUTPUT
            else
              echo "SHOULD_BUILD=0" >> $GITHUB_OUTPUT
            fi
          fi

    outputs:
      SHOULD_BUILD: ${{ steps.should_build.outputs.SHOULD_BUILD }}

  run:
    needs: check
    if: ${{ needs.check.outputs.SHOULD_BUILD == 1 || github.event_name == 'workflow_dispatch' }}
    permissions: write-all
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v5
        with:
          distribution: "zulu"
          java-version: "21"

      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: true

      - name: Get next version code
        id: next_ver_code
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG=$(gh release list -L 1 | awk -F '\t' '{print $3}')
          if [ -z "$TAG" ]; then TAG=0; fi
          echo "NEXT_VER_CODE=$((TAG + 1))" >> $GITHUB_OUTPUT

      - name: Build modules/APKs
        run: ./build.sh custom_config.toml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          NEXT_VER_CODE: ${{ steps.next_ver_code.outputs.NEXT_VER_CODE }}

      - name: Re-sign APKs
        env:
          KEYSTORE: ${{ secrets.KEYSTORE }}
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASS: ${{ secrets.KEY_PASS }}
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE" ]; then
            echo "No KEYSTORE secret found. Refusing to publish unsigned APKs."
            exit 1
          fi
          if [ -z "$KEYSTORE_PASS" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASS" ]; then
            echo "Signing secrets are incomplete. Refusing to publish APKs."
            exit 1
          fi
          
          # Decode keystore
          echo "$KEYSTORE" | base64 -d > custom.keystore
          trap 'rm -f custom.keystore' EXIT

          EXPECTED_CERT=$(keytool -list -v -keystore custom.keystore \
            -storepass "$KEYSTORE_PASS" -alias "$KEY_ALIAS" |
            sed -nE 's/^\s*SHA-?256: //p' | head -1 | tr -d ':' | tr '[:lower:]' '[:upper:]')
          if [ -z "$EXPECTED_CERT" ]; then
            echo "Could not read the signing certificate from KEYSTORE."
            exit 1
          fi
          
          cd build || { echo "build folder not found"; exit 1; }
          
          # Find Android build tools for zipalign and apksigner
          BUILD_TOOLS_PATH=$(ls -d $ANDROID_HOME/build-tools/* | tail -1)
          ZIPALIGN="$BUILD_TOOLS_PATH/zipalign"
          APKSIGNER="$BUILD_TOOLS_PATH/apksigner"
          shopt -s nullglob
          APKS=( *.apk )
          if [ "${#APKS[@]}" -eq 0 ]; then
            echo "No APK artifacts found. Refusing to publish an empty release."
            exit 1
          fi

          for apk in "${APKS[@]}"; do
            echo "Processing $apk"
            
            # Strip generic test keys
            zip -d "$apk" "META-INF/*" || true
            
            # Zipalign into a new file
            "$ZIPALIGN" -p -f 4 "$apk" "aligned_$apk"
            
            # Sign with our custom keystore
            "$APKSIGNER" sign --ks ../custom.keystore \
              --ks-pass "pass:$KEYSTORE_PASS" \
              --ks-key-alias "$KEY_ALIAS" \
              --key-pass "pass:$KEY_PASS" \
              "aligned_$apk"
              
            # Replace original with signed version
            mv "aligned_$apk" "$apk"

            ACTUAL_CERT=$("$APKSIGNER" verify --print-certs "$apk" |
              sed -nE 's/.*certificate SHA-256 digest: //p' | head -1 |
              tr -d ':' | tr '[:lower:]' '[:upper:]')
            if [ "$ACTUAL_CERT" != "$EXPECTED_CERT" ]; then
              echo "Certificate verification failed for $apk."
              exit 1
            fi
          done
          cd ..

      - name: Get output
        id: get_output
        run: |
          DELIM="$(openssl rand -hex 8)"
          echo "BUILD_LOG<<${DELIM}" >> "$GITHUB_OUTPUT"
          cat build.md >> "$GITHUB_OUTPUT"
          echo "${DELIM}" >> "$GITHUB_OUTPUT"

      - name: Upload release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.next_ver_code.outputs.NEXT_VER_CODE }}
          BODY: ${{ steps.get_output.outputs.BUILD_LOG }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "ReVanced Custom" --notes "$BODY"
            gh release upload "$TAG" ./build/* --clobber
          else
            gh release create "$TAG" ./build/* --title "ReVanced Custom" --notes "$BODY"
          fi

      - name: Update custom build state
        env:
          BUILD_VERSION: ${{ steps.next_ver_code.outputs.NEXT_VER_CODE }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch --no-tags origin custom-update || true

          PARENT=$(git rev-parse refs/remotes/origin/custom-update 2>/dev/null || true)
          BLOB=$(git hash-object -w build.md)
          TREE=$(printf '100644 blob %s\tbuild.md\n' "$BLOB" | git mktree)
          if [ -n "$PARENT" ]; then
            STATE_COMMIT=$(printf 'Custom build state %s\n\n' "$BUILD_VERSION" | git commit-tree "$TREE" -p "$PARENT")
          else
            STATE_COMMIT=$(printf 'Custom build state %s\n\n' "$BUILD_VERSION" | git commit-tree "$TREE")
          fi
          git push origin "$STATE_COMMIT:refs/heads/custom-update"

      - name: Report to Telegram
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
        if: env.TG_TOKEN != null && env.TG_CHAT != null
        run: |
          cd build || { echo "build folder not found"; exit 1; }
          
          NL=$'\n'
          APKS=""
          
          BUILD_TOOLS_PATH=$(ls -d "$ANDROID_HOME"/build-tools/* | tail -1)
          AAPT="$BUILD_TOOLS_PATH/aapt"
          SOURCE_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"

          for OUTPUT in *.apk; do
            [ -f "$OUTPUT" ] || continue
            DL_URL="$SOURCE_URL/releases/download/${{ steps.next_ver_code.outputs.NEXT_VER_CODE }}/${OUTPUT}"

            # Keep the variant name stable while allowing the version to change.
            APK_PREFIX=$(printf '%s' "$OUTPUT" | sed -E 's/-v[0-9]+([.][0-9]+)*.*[.]apk$//')
            APK_FILTER="^${APK_PREFIX}-v.*[.]apk$"
            APP_NAME=$(printf '%s' "$APK_PREFIX" | sed -E 's/[-_]+/ /g')

            APP_ID=$("$AAPT" dump badging "$OUTPUT" 2>/dev/null | sed -n "s/^package: name='\\([^']*\\)'.*/\\1/p" | head -1)
            [ -n "$APP_ID" ] || APP_ID="temp-$(printf '%s' "$APK_PREFIX" | sha256sum | cut -c1-12)"

            SETTINGS=$(python3 -c 'import json,sys; print(json.dumps({"includePrereleases":False,"fallbackToOlderReleases":True,"filterReleaseTitlesByRegEx":"ReVanced Custom","apkFilterRegEx":sys.argv[1],"autoApkFilterByArch":True},separators=(",",":")))' "$APK_FILTER")
            CONFIG=$(python3 -c 'import json,sys; print(json.dumps({"id":sys.argv[1],"url":sys.argv[2],"author":"Neoniq","name":sys.argv[3],"preferredApkIndex":0,"additionalSettings":sys.argv[4],"overrideSource":None},separators=(",",":")))' "$APP_ID" "$SOURCE_URL" "$APP_NAME" "$SETTINGS")
            ENCODED_CONFIG=$(python3 -c 'import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1],safe=""))' "$CONFIG")
            DIRECT_URL="obtainium://app/${ENCODED_CONFIG}"
            REDIRECT_URL="https://apps.obtainium.imranr.dev/redirect?r=${DIRECT_URL}"

            APKS+="${NL}📦 *${APP_NAME}*${NL}↳ [APK](${DL_URL}) · [Obtainium](${REDIRECT_URL})"
          done

          if [ -n "$APKS" ]; then APKS="Apps:${NL}${APKS#"$NL"}"; fi

          BODY="$(cat ../build.md)"
          
          DOWNLOAD_SECTION=""
          if [ -n "$APKS" ]; then
            DOWNLOAD_SECTION="*🔗 Download Links:*${NL}${NL}${APKS}${NL}${NL}ℹ️ Obtainium: если появляется Invalid input, откройте ссылку во внешнем браузере, а не внутри Telegram.${NL}"
          fi
          
          MSG="*New Custom Build completed! 🎉*
          
          ${BODY}
          
          ${DOWNLOAD_SECTION}
          *📊 Build Info:*
          ↪ Version: ${{ steps.next_ver_code.outputs.NEXT_VER_CODE }}
          ↪ Commit: [\`${GITHUB_SHA:0:7}\`](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA})
          ↪ Repository: [${GITHUB_REPOSITORY}](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY})
          "
          MSG=${MSG:0:4000}
          
          echo "--- Sending Summary Message ---"
          curl -X POST --data-urlencode "parse_mode=Markdown" --data-urlencode "disable_web_page_preview=true" --data-urlencode "text=${MSG}" --data-urlencode "chat_id=${TG_CHAT}" "https://api.telegram.org/bot${TG_TOKEN}/sendMessage"

